<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>清单</title>
    <style>
        :root {
            --paper: #eeece4;
            --ink: #2a2a26;
            --ink-soft: #6b6a63;
            --line: #d8d5c9;
            --accent: #1f5f5b;
            --accent-soft: #dfe9e8;
            --pending: #b8862b;
            --pending-soft: #f3e8d3;
            --danger: #a3402f;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--paper);
            color: var(--ink);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            display: flex;
            justify-content: center;
            padding: 48px 20px;
        }

        .sheet {
            width: 100%;
            max-width: 560px;
        }

        header {
            margin-bottom: 32px;
            border-bottom: 2px solid var(--ink);
            padding-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: baseline;
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            margin: 0;
            letter-spacing: -0.01em;
        }

        #count {
            font-size: 14px;
            color: var(--ink-soft);
        }

        form#add-form {
            display: flex;
            gap: 8px;
            margin-bottom: 28px;
        }

        #name-input {
            flex: 1;
            padding: 12px 14px;
            border: 1.5px solid var(--line);
            border-radius: 6px;
            font-size: 15px;
            background: #fff;
            color: var(--ink);
        }

        #name-input:focus {
            outline: none;
            border-color: var(--accent);
        }

        button {
            font-family: inherit;
            cursor: pointer;
            border: none;
        }

        #add-form button {
            padding: 12px 20px;
            background: var(--ink);
            color: var(--paper);
            border-radius: 6px;
            font-size: 15px;
            font-weight: 600;
        }

        #add-form button:hover { background: var(--accent); }

        ul#list {
            list-style: none;
            margin: 0;
            padding: 0;
        }

        li.item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 4px;
            border-bottom: 1px solid var(--line);
        }

        .status-toggle {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            border: 2px solid var(--pending);
            background: transparent;
            flex-shrink: 0;
            position: relative;
        }

        .status-toggle.done {
            border-color: var(--accent);
            background: var(--accent);
        }

        .status-toggle.done::after {
            content: "";
            position: absolute;
            left: 6px;
            top: 2px;
            width: 5px;
            height: 10px;
            border-right: 2px solid var(--paper);
            border-bottom: 2px solid var(--paper);
            transform: rotate(45deg);
        }

        .item-name {
            flex: 1;
            font-size: 16px;
            word-break: break-word;
        }

        .item-name.done {
            color: var(--ink-soft);
            text-decoration: line-through;
        }

        .item-name[contenteditable="true"] {
            outline: none;
            border-bottom: 1px dashed var(--accent);
        }

        .tag {
            font-size: 12px;
            padding: 3px 8px;
            border-radius: 4px;
            white-space: nowrap;
        }

        .tag.pending { background: var(--pending-soft); color: var(--pending); }
        .tag.done { background: var(--accent-soft); color: var(--accent); }

        .del-btn {
            background: transparent;
            color: var(--ink-soft);
            font-size: 18px;
            line-height: 1;
            padding: 4px 6px;
            border-radius: 4px;
        }

        .del-btn:hover { color: var(--danger); background: #f3e2de; }

        #empty {
            text-align: center;
            color: var(--ink-soft);
            padding: 40px 0;
            font-size: 14px;
            display: none;
        }

        #error {
            display: none;
            background: #f3e2de;
            color: var(--danger);
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 14px;
            margin-bottom: 16px;
        }
    </style>
</head>
<body>

<div class="sheet">
    <header>
        <h1>清单</h1>
        <span id="count"></span>
    </header>

    <div id="error"></div>

    <form id="add-form">
        <input id="name-input" type="text" placeholder="添加一件事…" autocomplete="off" required>
        <button type="submit">添加</button>
    </form>

    <ul id="list"></ul>
    <div id="empty">还没有任何事项</div>
</div>

<script>
    const API = '/api/v1/todo';

    const listEl = document.getElementById('list');
    const emptyEl = document.getElementById('empty');
    const countEl = document.getElementById('count');
    const errorEl = document.getElementById('error');
    const form = document.getElementById('add-form');
    const nameInput = document.getElementById('name-input');

    function showError(msg) {
        errorEl.textContent = msg;
        errorEl.style.display = 'block';
        setTimeout(() => { errorEl.style.display = 'none'; }, 3000);
    }

    async function request(url, options = {}) {
        const res = await fetch(url, {
            headers: { 'Content-Type': 'application/json' },
            ...options,
        });
        const body = await res.json().catch(() => ({}));
        if (!res.ok) {
            throw new Error(body.msg || `请求失败 (${res.status})`);
        }
        return body;
    }

    function render(todos) {
        listEl.innerHTML = '';
        emptyEl.style.display = todos.length === 0 ? 'block' : 'none';
        countEl.textContent = todos.length ? `${todos.filter(t => t.status === 'pending').length} 项待完成` : '';

        todos.forEach(todo => {
            const li = document.createElement('li');
            li.className = 'item';

            const toggle = document.createElement('button');
            toggle.className = 'status-toggle' + (todo.status === 'done' ? ' done' : '');
            toggle.title = todo.status === 'done' ? '标记为待完成' : '标记为已完成';
            toggle.onclick = () => updateStatus(todo, todo.status === 'done' ? 'pending' : 'done');

            const name = document.createElement('span');
            name.className = 'item-name' + (todo.status === 'done' ? ' done' : '');
            name.textContent = todo.name;
            name.setAttribute('contenteditable', 'true');
            name.addEventListener('blur', () => {
                const newVal = name.textContent.trim();
                if (newVal && newVal !== todo.name) {
                    updateContent(todo, newVal);
                } else {
                    name.textContent = todo.name;
                }
            });
            name.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') { e.preventDefault(); name.blur(); }
            });

            const tag = document.createElement('span');
            tag.className = 'tag ' + todo.status;
            tag.textContent = todo.status === 'done' ? '已完成' : '待完成';

            const del = document.createElement('button');
            del.className = 'del-btn';
            del.textContent = '×';
            del.title = '删除';
            del.onclick = () => removeTodo(todo);

            li.append(toggle, name, tag, del);
            listEl.appendChild(li);
        });
    }

    async function loadTodos() {
        try {
            const { data } = await request(API);
            render(data || []);
        } catch (e) {
            showError(e.message);
        }
    }

    async function addTodo(name) {
        try {
            await request(API, {
                method: 'POST',
                body: JSON.stringify({ name, status: 'pending' }),
            });
            await loadTodos();
        } catch (e) {
            showError(e.message);
        }
    }

    async function updateStatus(todo, status) {
        try {
            await request(`${API}/${todo.ID}`, {
                method: 'PUT',
                body: JSON.stringify({ status }),
            });
            await loadTodos();
        } catch (e) {
            showError(e.message);
        }
    }

    async function updateContent(todo, content) {
        try {
            await request(`${API}/${todo.ID}`, {
                method: 'PUT',
                body: JSON.stringify({ content }),
            });
            await loadTodos();
        } catch (e) {
            showError(e.message);
        }
    }

    async function removeTodo(todo) {
        try {
            await request(`${API}/${todo.ID}`, { method: 'DELETE' });
            await loadTodos();
        } catch (e) {
            showError(e.message);
        }
    }

    form.addEventListener('submit', (e) => {
        e.preventDefault();
        const val = nameInput.value.trim();
        if (!val) return;
        addTodo(val);
        nameInput.value = '';
    });

    loadTodos();
</script>

</body>
</html>
